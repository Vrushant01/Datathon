version: 1

runners:
  high:
    config-id: 3

pipeline-when:
  equal:
    - << event.ref >>
    - refs/heads/main

jobs:

  backend-build:
    cwd: /catalyst/backend
    steps:
      - npm ci
      - npm run build

  backend-deploy:
    when:
      equal:
        - << status.build.backend-build >>
        - success
    cwd: /catalyst
    steps:
      - ls -la backend/src || echo "NO SRC DIR"
      - cd backend && npm ci && npm run build
      - ls -la backend/node_modules | head -5
      - du -sh backend/node_modules
      - 'echo "BUILD EXIT: $?"'
      - find backend/dist -type f || echo "NO DIST"
      - npm install -g zcatalyst-cli@beta
      - >-
        catalyst deploy appsail --name backend
        --build-path "backend"
        --stack node20
        --command "node dist/app.js"
        --token "$CATALYST_TOKEN"
        --verbose

stages:

  - name: build
    jobs:
      - backend-build

  - name: deploy
    jobs:
      - backend-deploy