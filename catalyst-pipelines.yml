version: 1

runners:
  high:
    config-id: 3

pipeline-when:
  equal:
    - << event.ref >>
    - refs/heads/main

jobs:

  backend-build:
    cwd: /catalyst/backend
    steps:
      - apt-get update
      - apt-get install -y curl
      - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      - apt-get install -y nodejs
      - node --version
      - npm --version
      - npm ci
      - npm run build
      - test -f dist/app.js

  backend-deploy:
    when:
      equal:
        - << status.build.backend-build >>
        - success

    cwd: /catalyst/backend

    steps:
      - apt-get update
      - apt-get install -y curl
      - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      - apt-get install -y nodejs

      - node --version
      - npm --version

      # Each pipeline job has its own isolated workspace.
      # Build AND install node_modules — AppSail does NOT auto-run npm install.
      - npm ci
      - npm run build

      # Hard-verify both critical files exist before packaging.
      - test -f package.json
      - test -f dist/app.js

      # Pin to EXACT same CLI version as local (1.27.0).
      # @beta uses a different standalone mode that bypasses app-config.json
      # and does not reliably include node_modules/dist in the archive.
      - npm install -g zcatalyst-cli@1.27.0

      - >-
        catalyst deploy appsail --name backend
        --build-path "."
        --stack "node20"
        --command "node dist/app.js"
        --token "$CATALYST_TOKEN"
        --verbose

stages:

  - name: build
    jobs:
      - backend-build

  - name: deploy
    jobs:
      - backend-deploy