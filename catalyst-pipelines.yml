version: 1

runners:
  high:
    config-id: 3

pipeline-when:
  equal:
    - << event.ref >>
    - refs/heads/main

jobs:

  backend-build:
    cwd: /catalyst/backend
    steps:
      - npm ci
      - npm run build

  backend-deploy:
    when:
      equal:
        - << status.build.backend-build >>
        - success
    cwd: /catalyst/backend
    steps:
      - npm install -g zcatalyst-cli@beta
      - >-
        catalyst deploy appsail
        --name backend
        --build-path "/catalyst/backend"
        --stack "NodeJS 20"
        --command "node dist/app.js"
        --token "$CATALYST_TOKEN"
        --verbose

stages:

  - name: build
    jobs:
      - backend-build

  - name: deploy
    jobs:
      - backend-deploy