version: 1

runners:
  high:
    config-id: 3

pipeline-when:
  equal:
    - << event.ref >>
    - refs/heads/main

jobs:

  backend-build:
    cwd: /catalyst/backend
    steps:
      - npm ci
      - npm run build

  backend-deploy:
    when:
      equal:
        - << status.build.backend-build >>
        - success
    cwd: /catalyst
    steps:
      - >-
        cd backend && npm ci && npm run build &&
        git add -f dist node_modules &&
        git -c user.email="ci@local" -c user.name="ci" commit -m "ci: include build output for deploy" --no-verify &&
        npm install -g zcatalyst-cli@beta &&
        catalyst deploy appsail --name backend
        --build-path "backend"
        --stack node20
        --command "npm ci --omit=dev && node dist/app.js"
        --token "$CATALYST_TOKEN"
        --verbose

stages:

  - name: build
    jobs:
      - backend-build

  - name: deploy
    jobs:
      - backend-deploy