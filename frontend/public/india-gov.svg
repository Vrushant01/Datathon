<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="100%" height="100%">
  <defs>
    <linearGradient id="emblem-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE07D"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
  </defs>
  <!-- Background border -->
  <rect x="2" y="2" width="156" height="46" rx="6" fill="#0b2240" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  
  <!-- Sarnath Lion Capital Emblem Silhouette -->
  <g transform="translate(25, 25) scale(0.65)" fill="url(#emblem-gold)">
    <!-- Base/Abacus -->
    <path d="M-15,10 L15,10 L12,15 L-12,15 Z"/>
    <!-- Central Wheel -->
    <circle cx="0" cy="4" r="4" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <!-- Lions Silhouette -->
    <path d="M-8,-20 C-8,-10 -15,-5 -15,5 L15,5 C15,-5 8,-10 8,-20 C8,-25 4,-28 0,-28 C-4,-28 -8,-25 -8,-20 Z"/>
  </g>
  
  <!-- Text "india.gov.in" -->
  <text x="50" y="26" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="13" fill="#ffffff" letter-spacing="0.5">
    india.<tspan fill="#FF9933">gov</tspan>.<tspan fill="#128807">in</tspan>
  </text>
  <text x="50" y="38" font-family="Arial, sans-serif" font-weight="bold" font-size="7" fill="#888" letter-spacing="0.5" uppercase="true">
    National Portal of India
  </text>
</svg>
