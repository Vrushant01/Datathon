<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="100%" height="100%">
  <defs>
    <linearGradient id="flag-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#128807"/>
    </linearGradient>
  </defs>
  <!-- Background border -->
  <rect x="2" y="2" width="156" height="46" rx="6" fill="#0b2240" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <!-- Decorative Tri-color bar at the top -->
  <rect x="10" y="8" width="140" height="2" fill="url(#flag-grad)"/>
  <!-- Text "Digital" and "India" -->
  <text x="18" y="32" font-family="Montserrat, Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="1">
    Digital
  </text>
  <text x="88" y="32" font-family="Montserrat, Arial, sans-serif" font-weight="900" font-size="18" fill="#FF9933" letter-spacing="1">
    India
  </text>
  <text x="18" y="42" font-family="Arial, sans-serif" font-weight="bold" font-size="7" fill="#128807" letter-spacing="0.5" opacity="0.9">
    Power To Empower
  </text>
  <!-- Ashoka Chakra Symbol -->
  <circle cx="140" cy="27" r="6" fill="none" stroke="#000080" stroke-width="1"/>
  <circle cx="140" cy="27" r="1.5" fill="#000080"/>
</svg>
