<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="50%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D50000"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>
  </defs>

  <!-- 1. Background Leafy Scrollwork (Green foliage at the bottom) -->
  <g id="foliage" fill="#1B5E20" stroke="#0D1F0D" stroke-width="1.5">
    <!-- Left Leaf Scroll -->
    <path d="M 200 290 C 130 290 80 260 50 320 C 80 340 140 330 200 300 Z" />
    <path d="M 120 295 C 100 280 60 290 40 310 C 60 320 90 315 120 295 Z" />
    <path d="M 170 300 C 140 300 110 320 90 335 C 120 335 150 320 170 300 Z" />
    <!-- Right Leaf Scroll -->
    <path d="M 200 290 C 270 290 320 260 350 320 C 320 340 260 330 200 300 Z" />
    <path d="M 280 295 C 300 280 340 290 360 310 C 340 320 310 315 280 295 Z" />
    <path d="M 230 300 C 260 300 290 320 310 335 C 280 335 250 320 230 300 Z" />
  </g>

  <!-- 2. Golden Ribbon at the bottom -->
  <g id="ribbon">
    <path d="M 100 330 Q 200 360 300 330 L 290 365 Q 200 385 110 365 Z" fill="#FFE082" stroke="#FF8F00" stroke-width="2" />
    <!-- Ribbon ends -->
    <path d="M 100 330 L 70 345 L 110 365 Z" fill="#FFCA28" stroke="#FF8F00" stroke-width="1.5" />
    <path d="M 300 330 L 330 345 L 290 365 Z" fill="#FFCA28" stroke="#FF8F00" stroke-width="1.5" />
    <!-- Text: Satyameva Jayate -->
    <text x="200" y="358" font-family="Georgia, serif" font-weight="bold" font-size="14" fill="#5D4037" text-anchor="middle">
      सत्यಮೇವು ಜಯತೇ
    </text>
  </g>

  <!-- 3. Central Shield -->
  <g id="shield" transform="translate(200, 205)">
    <!-- Blue/Purple border -->
    <path d="M -45 -65 C -45 -65 0 -85 0 -85 C 0 -85 45 -65 45 -65 C 45 -65 50 10 35 45 C 20 80 0 95 0 95 C 0 95 -20 80 -35 45 C -50 10 -45 -65 -45 -65 Z" fill="#283593" stroke="#D4AF37" stroke-width="3" />
    <!-- Inner Red Shield -->
    <path d="M -38 -60 C -38 -60 0 -77 0 -77 C 0 -77 38 -60 38 -60 C 38 -60 42 7 30 38 C 17 68 0 83 0 83 C 0 83 -17 68 -30 38 C -42 7 -38 -60 -38 -60 Z" fill="url(#shield-grad)" stroke="#283593" stroke-width="1" />
    
    <!-- White Double-Headed Eagle (Gandaberunda) -->
    <g transform="translate(0, 0) scale(1.15)" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="0.75">
      <!-- Body & Tail -->
      <path d="M -8 -15 Q 0 -18 8 -15 Q 12 5 8 18 Q 0 30 -8 18 Q -12 5 -8 -15 Z" fill="#FFFFFF"/>
      <path d="M -4 18 L -10 32 L -4 28 L 0 34 L 4 28 L 10 32 L 4 18 Z" fill="#ECEFF1"/>
      <!-- Left Wing -->
      <path d="M -8 -8 C -22 -15 -35 5 -20 12 C -15 15 -10 5 -8 -8 Z" />
      <path d="M -12 0 C -25 -2 -30 15 -18 18 C -14 20 -10 10 -12 0 Z" />
      <!-- Right Wing -->
      <path d="M 8 -8 C 22 -15 35 5 20 12 C 15 15 10 5 8 -8 Z" />
      <path d="M 12 0 C 25 -2 30 15 18 18 C 14 20 10 10 12 0 Z" />
      <!-- Left Head -->
      <path d="M -3 -15 C -8 -22 -22 -18 -18 -10 C -15 -5 -8 -10 -3 -15 Z" />
      <path d="M -18 -12 L -24 -14 L -18 -16 Z" fill="#ECEFF1"/> <!-- Beak -->
      <!-- Right Head -->
      <path d="M 3 -15 C 8 -22 22 -18 18 -10 C 15 -5 8 -10 3 -15 Z" />
      <path d="M 18 -12 L 24 -14 L 18 -16 Z" fill="#ECEFF1"/> <!-- Beak -->
    </g>
  </g>

  <!-- 4. Left Sarabha (Lion-Elephant) -->
  <g id="left-sarabha" transform="translate(110, 215) scale(0.9)">
    <!-- Legs & Body -->
    <path d="M 5 -10 C -25 -10 -55 -40 -65 -80 C -60 -110 -25 -130 5 -110 C 15 -80 25 -40 5 -10 Z" fill="url(#gold-grad)" stroke="#B56C00" stroke-width="1.5" />
    <path d="M -50 -20 C -70 -20 -90 40 -80 75 C -75 80 -65 80 -60 70 C -55 40 -40 10 -50 -20 Z" fill="url(#gold-grad)" stroke="#B56C00" stroke-width="1.5" /> <!-- Left Back Leg -->
    <path d="M -25 -10 C -45 0 -60 50 -50 80 C -45 85 -35 85 -30 75 C -25 50 -15 10 -25 -10 Z" fill="url(#gold-grad)" stroke="#B56C00" stroke-width="1.5" /> <!-- Right Back Leg -->
    <path d="M 10 -30 C -10 0 -20 60 -10 90 C -5 95 5 95 10 85 C 15 60 25 10 10 -30 Z" fill="url(#gold-grad)" stroke="#B56C00" stroke-width="1.5" /> <!-- Front Leg -->
    
    <!-- Red Lion Mane -->
    <path d="M 0 -110 C -30 -140 -50 -90 -45 -60 C -40 -30 -10 -40 0 -110 Z" fill="#D50000" stroke="#990000" stroke-width="1" />
    <path d="M -15 -90 C -35 -110 -45 -80 -40 -60 C -35 -40 -20 -50 -15 -90 Z" fill="#FF1744" />
    
    <!-- Head & Trunk -->
    <circle cx="5" cy="-125" r="18" fill="url(#gold-grad)" stroke="#B56C00" stroke-width="1.5" />
    <!-- Trunk curved up -->
    <path d="M 18 -125 C 30 -140 40 -160 30 -185 C 20 -195 15 -190 20 -180 C 28 -160 15 -145 10 -135 Z" fill="url(#gold-grad)" stroke="#B56C00" stroke-width="1.5" />
    <path d="M 0 -130 L 15 -138 L 5 -142 Z" fill="#FFF8E1" /> <!-- Tusk -->
    <path d="M -5 -112 L -2 -100 L -8 -96 Z" fill="#D50000" /> <!-- Tail -->
  </g>

  <!-- 5. Right Sarabha (Lion-Elephant) -->
  <g id="right-sarabha" transform="translate(290, 215) scale(0.9) scale(-1, 1)">
    <!-- Legs & Body -->
    <path d="M 5 -10 C -25 -10 -55 -40 -65 -80 C -60 -110 -25 -130 5 -110 C 15 -80 25 -40 5 -10 Z" fill="url(#gold-grad)" stroke="#B56C00" stroke-width="1.5" />
    <path d="M -50 -20 C -70 -20 -90 40 -80 75 C -75 80 -65 80 -60 70 C -55 40 -40 10 -50 -20 Z" fill="url(#gold-grad)" stroke="#B56C00" stroke-width="1.5" />
    <path d="M -25 -10 C -45 0 -60 50 -50 80 C -45 85 -35 85 -30 75 C -25 50 -15 10 -25 -10 Z" fill="url(#gold-grad)" stroke="#B56C00" stroke-width="1.5" />
    <path d="M 10 -30 C -10 0 -20 60 -10 90 C -5 95 5 95 10 85 C 15 60 25 10 10 -30 Z" fill="url(#gold-grad)" stroke="#B56C00" stroke-width="1.5" />
    
    <!-- Red Lion Mane -->
    <path d="M 0 -110 C -30 -140 -50 -90 -45 -60 C -40 -30 -10 -40 0 -110 Z" fill="#D50000" stroke="#990000" stroke-width="1" />
    <path d="M -15 -90 C -35 -110 -45 -80 -40 -60 C -35 -40 -20 -50 -15 -90 Z" fill="#FF1744" />
    
    <!-- Head & Trunk -->
    <circle cx="5" cy="-125" r="18" fill="url(#gold-grad)" stroke="#B56C00" stroke-width="1.5" />
    <path d="M 18 -125 C 30 -140 40 -160 30 -185 C 20 -195 15 -190 20 -180 C 28 -160 15 -145 10 -135 Z" fill="url(#gold-grad)" stroke="#B56C00" stroke-width="1.5" />
    <path d="M 0 -130 L 15 -138 L 5 -142 Z" fill="#FFF8E1" />
    <path d="M -5 -112 L -2 -100 L -8 -96 Z" fill="#D50000" />
  </g>

  <!-- 6. Lion Capital of Ashoka (at the top) -->
  <g id="lion-capital" transform="translate(200, 85) scale(0.95)">
    <!-- Base Abacus -->
    <rect x="-24" y="10" width="48" height="8" rx="2" fill="#CFD8DC" stroke="#78909C" stroke-width="1.5" />
    <circle cx="0" cy="14" r="3.5" fill="none" stroke="#0D47A1" stroke-width="1" /> <!-- Wheel -->
    
    <!-- Lions sitting back to back -->
    <g fill="url(#gold-grad)" stroke="#B56C00" stroke-width="1.5">
      <!-- Central Lion -->
      <path d="M -10 -25 C -10 -35 -20 -40 -5 -40 C 5 -40 10 -35 10 -25 C 10 -15 6 10 6 10 L -6 10 C -6 10 -10 -15 -10 -25 Z" />
      <circle cx="0" cy="-28" r="6" /> <!-- Face -->
      <!-- Left Lion Profile -->
      <path d="M -10 -22 C -18 -32 -26 -28 -22 -20 C -18 -12 -12 10 -12 10 L -6 10 C -6 10 -10 -12 -10 -22 Z" />
      <!-- Right Lion Profile -->
      <path d="M 10 -22 C 18 -32 26 -28 22 -20 C 18 -12 12 10 12 10 L 6 10 C 6 10 10 -12 10 -22 Z" />
    </g>
  </g>
</svg>
